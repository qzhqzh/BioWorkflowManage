[scheduler]
container_backend = docker_swarm
task_concurrency = 1
download_concurrency = 1
subworkflow_concurrency = 1
fail_fast = true

[docker_swarm]
# The runner only connects to the isolated Docker-in-Docker daemon.
auto_init = true
allow_networks = []

[file_io]
root = $MINIWDL_RUN_ROOT
allow_any_input = false
copy_input_files = false
chown = true
output_hardlinks = false
delete_work = false
mount_tmpdir = false

[task_runtime]
as_user = true
allow_privileged = false
memory_limit_multiplier = 1.0

[call_cache]
get = false
put = false
dir = $MINIWDL_RUN_ROOT/cache/calls

[download_cache]
get = false
put = false
dir = $MINIWDL_RUN_ROOT/cache/downloads
