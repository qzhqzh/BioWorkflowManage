[scheduler]
container_backend = docker_swarm
task_concurrency = 1
download_concurrency = 1
subworkflow_concurrency = 1
fail_fast = false

[docker_swarm]
# The selected runner connects either to isolated DIND or the trusted host daemon.
auto_init = true
allow_networks = []
polling_period_seconds = 5
server_error_retries = 24

[file_io]
root = $MINIWDL_RUN_ROOT
allow_any_input = false
copy_input_files = false
chown = true
output_hardlinks = false
delete_work = false
mount_tmpdir = false

[task_runtime]
as_user = true
allow_privileged = false
memory_limit_multiplier = 1.0

[call_cache]
get = true
put = true
dir = $MINIWDL_RUN_ROOT/cache/calls

[download_cache]
get = false
put = false
dir = $MINIWDL_RUN_ROOT/cache/downloads
