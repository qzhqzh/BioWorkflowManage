name: Validate BioWorkflowManage

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: "ci-only-password"
  DJANGO_SECRET_KEY: "ci-only-secret-key"
  MINIWDL_DOCKER_GID: "988"

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-golden:
    name: Contracts and golden fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Validate JSON contracts and fixture digests
        run: uv run python scripts/validate_contracts.py

      - name: Validate generated WDL syntax
        run: uv run python scripts/miniwdl_runtime.py check

      - name: Validate Analysis Node product Compose profiles
        env:
          ANALYSIS_NODE_ENV_FILE: .env.example
        run: |
          docker compose \
            --project-directory deploy/analysis-node \
            --env-file deploy/analysis-node/.env.example \
            --env-file deploy/analysis-node/images.env.example \
            -f deploy/analysis-node/compose.yml \
            --profile headless \
            --profile isolated-runtime \
            config --quiet
          docker compose \
            --project-directory deploy/analysis-node \
            --env-file deploy/analysis-node/.env.example \
            --env-file deploy/analysis-node/images.env.example \
            -f deploy/analysis-node/compose.yml \
            --profile console \
            --profile host-runtime \
            config --quiet

  miniwdl-runtime-smoke:
    name: miniwdl isolated runtime smoke
    runs-on: ubuntu-latest
    needs: [contracts-and-golden]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run a real miniwdl container task
        run: ./scripts/miniwdl.sh smoke

      - name: Show runtime logs on failure
        if: failure()
        run: ./scripts/miniwdl.sh logs

      - name: Upload miniwdl runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniwdl-runtime-${{ github.run_id }}
          path: data/miniwdl/work/runs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the isolated runtime
        if: always()
        run: ./scripts/miniwdl.sh stop

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint backend
        run: >-
          uvx --from ruff==0.15.14 ruff check
          backend scripts deploy/analysis-node/lib examples/reference_connector

      - name: Set up Java 17 for Connector example
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java 17 Connector client example
        run: |
          mkdir -p "$RUNNER_TEMP/reference-connector-java"
          javac -d "$RUNNER_TEMP/reference-connector-java" \
            examples/reference_connector/clients/MesConnectorClient.java
          if REFERENCE_CONNECTOR_URL=http://127.attacker.example \
            REFERENCE_CONNECTOR_INBOUND_TOKEN=connector-client-test-token \
            java -cp "$RUNNER_TEMP/reference-connector-java" \
              MesConnectorClient status test-run \
              > /dev/null 2> "$RUNNER_TEMP/reference-connector-java/http-error.log"; then
            echo "Java Connector client accepted a non-loopback HTTP origin" >&2
            exit 1
          fi
          grep -q 'must use HTTPS' \
            "$RUNNER_TEMP/reference-connector-java/http-error.log"

      - name: Verify source Connector Compose is reachable from the host
        env:
          BIOWORKFLOW_TOKEN: connector-compose-test-token
          BIOWORKFLOW_WEBHOOK_SECRET: cmVmZXJlbmNlLWNvbm5lY3Rvci13ZWJob29rLWtleSE
          REFERENCE_CONNECTOR_INBOUND_TOKEN: connector-compose-inbound-token-32
        run: |
          connector_root="$PWD/examples/reference_connector"
          cp "$connector_root/config.compose.example.json" \
            "$connector_root/config.compose.json"
          connector_compose() {
            docker compose \
              --project-name reference-connector-ci \
              --project-directory "$connector_root" \
              --file "$connector_root/compose.example.yml" \
              "$@"
          }
          cleanup_connector() {
            status=$?
            if [[ "$status" -ne 0 ]]; then
              connector_compose logs --no-color || true
            fi
            connector_compose down || true
            rm -f "$connector_root/config.compose.json"
            return "$status"
          }
          trap cleanup_connector EXIT
          connector_compose up --build -d
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8090/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            http://127.0.0.1:8090/health >/dev/null

      - name: Run backend tests
        run: uv run pytest backend/tests

      - name: Run Django system checks
        run: uv run python backend/manage.py check

      - name: Check for missing migrations
        run: uv run python backend/manage.py makemigrations --check --dry-run

  postgres-webhook-concurrency:
    name: PostgreSQL webhook concurrency
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: bioworkflow
      POSTGRES_USER: bioworkflow
      POSTGRES_PASSWORD: ci-only-password
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: bioworkflow
          POSTGRES_USER: bioworkflow
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioworkflow -d bioworkflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Verify claim exclusion and lease fencing
        run: >-
          uv run pytest
          backend/tests/test_webhooks.py::test_postgresql_delivery_claim_and_lease_fencing
          backend/tests/test_object_inputs.py::test_postgresql_input_staging_slot_is_serialized
          backend/tests/test_object_inputs.py::test_postgresql_cache_gc_waits_for_object_backed_run_creation
          backend/tests/test_artifact_exports.py::test_postgresql_artifact_export_claim_and_lease_fencing
          backend/tests/test_artifact_exports.py::test_cleanup_claim_skips_more_than_fifty_blocked_retention_rows
          backend/tests/test_integration_api.py::test_analysis_product_preflight_and_submission_pin_contract

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        run: bun run typecheck

      - name: Build frontend
        run: bun run build

  analysis-node-headless:
    name: Analysis Node headless API smoke
    runs-on: ubuntu-latest
    needs: [contracts-and-golden, backend]
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: "ci-database-password"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare isolated delivery configuration
        run: |
          cp deploy/analysis-node/.env.example deploy/analysis-node/.env
          cp deploy/analysis-node/images.env.example deploy/analysis-node/images.env
          ci_root="$RUNNER_TEMP/analysis-node-ci"
          worker_uid=$(id -u)
          worker_gid=$(id -g)
          sed -i \
            -e 's/^ANALYSIS_NODE_VERSION=.*/ANALYSIS_NODE_VERSION=0.0.0-ci/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-database-password/' \
            -e 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-django-secret-key-with-32-characters/' \
            -e 's/^WEBHOOK_SIGNING_KEY=.*/WEBHOOK_SIGNING_KEY=ci-webhook-signing-key-with-32-characters/' \
            -e 's/^ANALYSIS_MIN_AVAILABLE_MEMORY_GB=.*/ANALYSIS_MIN_AVAILABLE_MEMORY_GB=0/' \
            -e "s#^MINIWDL_UID=.*#MINIWDL_UID=$worker_uid#" \
            -e "s#^MINIWDL_GID=.*#MINIWDL_GID=$worker_gid#" \
            -e "s#/opt/analysis-node/data#$ci_root/data#g" \
            -e "s#/opt/analysis-node-backups#$ci_root/backups#g" \
            -e "s#/opt/analysis-node/secrets#$ci_root/secrets#g" \
            deploy/analysis-node/.env
          chmod 0600 deploy/analysis-node/.env
          sed -i 's/:1.0.0$/:0.0.0-ci/' deploy/analysis-node/images.env
          deploy/analysis-node/bin/analysis-node init

      - name: Build and stage fixed local images
        run: |
          pull_image() {
            local image=$1
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          docker build \
            --file Dockerfile.backend \
            --build-arg ANALYSIS_NODE_VERSION=0.0.0-ci \
            --build-arg GIT_REVISION="$GITHUB_SHA" \
            --tag bioworkflowmanage/backend:0.0.0-ci .
          pull_image m.daocloud.io/docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          pull_image m.daocloud.io/docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          pull_image m.daocloud.io/docker.io/library/docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
          pull_image m.daocloud.io/docker.io/library/python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
          docker tag m.daocloud.io/docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 bioworkflowmanage/postgres:0.0.0-ci
          docker tag m.daocloud.io/docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 bioworkflowmanage/gateway:0.0.0-ci
          docker tag m.daocloud.io/docker.io/library/docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce bioworkflowmanage/dind:0.0.0-ci
          docker tag m.daocloud.io/docker.io/library/python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de bioworkflowmanage/smoke-task:0.0.0-ci

      - name: Start source-built Headless Analysis Node
        run: |
          docker compose \
            --project-directory deploy/analysis-node \
            --env-file deploy/analysis-node/.env \
            --env-file deploy/analysis-node/images.env \
            -f deploy/analysis-node/compose.yml \
            --profile headless \
            --profile isolated-runtime \
            run --rm backend python backend/manage.py migrate --noinput
          docker compose \
            --project-directory deploy/analysis-node \
            --env-file deploy/analysis-node/.env \
            --env-file deploy/analysis-node/images.env \
            -f deploy/analysis-node/compose.yml \
            --profile headless \
            --profile isolated-runtime \
            up -d --wait
          docker image save bioworkflowmanage/smoke-task:0.0.0-ci | \
            docker compose \
              --project-directory deploy/analysis-node \
              --env-file deploy/analysis-node/.env \
              --env-file deploy/analysis-node/images.env \
              -f deploy/analysis-node/compose.yml \
              --profile headless \
              --profile isolated-runtime \
              exec -T miniwdl-docker docker load

      - name: Submit and complete a real Analysis Product through the API
        run: deploy/analysis-node/bin/analysis-node smoke --timeout 600

      - name: Show product service logs on failure
        if: failure()
        run: >-
          docker compose
          --project-directory deploy/analysis-node
          --env-file deploy/analysis-node/.env
          --env-file deploy/analysis-node/images.env
          -f deploy/analysis-node/compose.yml
          --profile headless
          --profile isolated-runtime
          logs --no-color

      - name: Stop Analysis Node without deleting data
        if: always()
        run: deploy/analysis-node/bin/analysis-node down

  end-to-end:
    name: Docker Compose browser smoke tests
    runs-on: ubuntu-latest
    needs: [contracts-and-golden, backend, frontend]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Prepare Nuxt types
        working-directory: frontend
        run: bunx nuxi prepare

      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Build and start the application
        env:
          DJANGO_SEED_USERS: "1"
          DJANGO_SEED_DEMO: "1"
          DJANGO_SEED_ALLOW_DEFAULT_PASSWORDS: "1"
          DJANGO_SESSION_COOKIE_SECURE: "0"
          DJANGO_CSRF_COOKIE_SECURE: "0"
        run: docker compose up -d --build --wait

      - name: Run browser smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8082
        run: bun run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the application
        if: always()
        run: docker compose down
