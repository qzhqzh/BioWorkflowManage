name: Release Analysis Node

on:
  push:
    tags:
      - "analysis-node-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: analysis-node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-package:
    name: Build, sign, and package linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REGISTRY: ghcr.io
      BACKEND_REPOSITORY: ghcr.io/qzhqzh/bioworkflowmanage-backend
      FRONTEND_REPOSITORY: ghcr.io/qzhqzh/bioworkflowmanage-frontend
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/analysis-node-v* ]]; then
            value=${GITHUB_REF_NAME#analysis-node-v}
          else
            value=$INPUT_VERSION
          fi
          if [[ ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid semantic version: $value" >&2
            exit 64
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies and run package gates
        run: |
          uv sync --frozen
          uvx --from ruff==0.15.14 ruff check backend scripts deploy/analysis-node/lib examples/reference_connector
          uv run pytest \
            backend/tests/test_analysis_node_deploy.py \
            backend/tests/test_reference_connector.py \
            backend/tests/test_analysis_runs.py::test_browser_rejects_unsigned_published_workflow_when_required \
            backend/tests/test_analysis_runs.py::test_browser_rejects_legacy_wdl_when_signed_packages_are_required \
            backend/tests/test_analysis_runs.py::test_worker_rejects_legacy_queued_unsigned_workflow_version \
            backend/tests/test_analysis_runs.py::test_worker_rejects_legacy_queued_wdl_asset_when_signed_packages_are_required \
            backend/tests/test_analysis_runs.py::test_worker_rejects_run_snapshot_not_bound_to_signed_workflow_version \
            backend/tests/test_analysis_runs.py::test_worker_rejects_non_product_workflow_when_product_is_required \
            backend/tests/test_analysis_runs.py::test_worker_keeps_accepted_product_run_executable_after_deactivation \
            backend/tests/test_integration_api.py::test_product_only_deployment_rejects_direct_workflow_source
          uv run python backend/manage.py check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.BACKEND_REPOSITORY }}:${{ steps.version.outputs.value }}
          build-args: |
            ANALYSIS_NODE_VERSION=${{ steps.version.outputs.value }}
            GIT_REVISION=${{ github.sha }}

      - name: Build and push console image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.FRONTEND_REPOSITORY }}:${{ steps.version.outputs.value }}
          build-args: |
            ANALYSIS_NODE_VERSION=${{ steps.version.outputs.value }}
            GIT_REVISION=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign application images and retain verification bundles
        env:
          BACKEND_REF: ${{ env.BACKEND_REPOSITORY }}@${{ steps.backend.outputs.digest }}
          FRONTEND_REF: ${{ env.FRONTEND_REPOSITORY }}@${{ steps.frontend.outputs.digest }}
        run: |
          mkdir -p dist/image-signatures
          cosign sign --yes --bundle dist/image-signatures/backend.sigstore.json "$BACKEND_REF"
          cosign sign --yes --bundle dist/image-signatures/frontend.sigstore.json "$FRONTEND_REF"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-analysis-node.yml@${GITHUB_REF}"
          cosign verify --offline \
            --bundle dist/image-signatures/backend.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$BACKEND_REF"
          cosign verify --offline \
            --bundle dist/image-signatures/frontend.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$FRONTEND_REF"

      - name: Build offline bundle and SBOMs
        env:
          BACKEND_REF: ${{ env.BACKEND_REPOSITORY }}@${{ steps.backend.outputs.digest }}
          FRONTEND_REF: ${{ env.FRONTEND_REPOSITORY }}@${{ steps.frontend.outputs.digest }}
        run: >-
          uv run python scripts/build_analysis_node_bundle.py
          --version "${{ steps.version.outputs.value }}"
          --backend-ref "$BACKEND_REF"
          --frontend-ref "$FRONTEND_REF"
          --git-revision "${{ github.sha }}"
          --signature-dir dist/image-signatures
          --output-dir dist

      - name: Sign package manifest and final archive
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          package="dist/analysis-node-$VERSION"
          archive="dist/analysis-node-$VERSION-linux-amd64.tar.gz"
          cosign sign-blob --yes --bundle "$package/SHA256SUMS.sigstore.json" "$package/SHA256SUMS"
          tar -C dist -czf "$archive" "analysis-node-$VERSION"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify generated signatures and bundle checksums
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          package="dist/analysis-node-$VERSION"
          archive="dist/analysis-node-$VERSION-linux-amd64.tar.gz"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-analysis-node.yml@${GITHUB_REF}"
          cosign verify-blob \
            --offline \
            --bundle "$package/SHA256SUMS.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$package/SHA256SUMS"
          cosign verify-blob \
            --offline \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          "$package/bin/analysis-node" \
            --env-file "$package/.env.example" \
            --images-env "$package/images.env" \
            verify-bundle

      - name: Exercise clean offline install, managed-input smoke, and restore
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          archive="$GITHUB_WORKSPACE/dist/analysis-node-$VERSION-linux-amd64.tar.gz"
          offline_root="$RUNNER_TEMP/analysis-node-offline-$VERSION"
          package="$offline_root/analysis-node-$VERSION"
          install_root="$RUNNER_TEMP/analysis-node-install-$VERSION"
          mkdir -p "$offline_root"
          tar -xzf "$archive" -C "$offline_root"
          cp "$package/.env.example" "$package/.env"
          worker_uid=$(id -u)
          worker_gid=$(id -g)
          sed -i \
            -e "s/^ANALYSIS_NODE_PROJECT_NAME=.*/ANALYSIS_NODE_PROJECT_NAME=analysis-node-release-$GITHUB_RUN_ID/" \
            -e 's/^ANALYSIS_NODE_API_PORT=.*/ANALYSIS_NODE_API_PORT=18082/' \
            -e 's/^ANALYSIS_NODE_CONSOLE_PORT=.*/ANALYSIS_NODE_CONSOLE_PORT=18083/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=release-gate-database-password/' \
            -e 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=release-gate-django-secret-with-32-characters/' \
            -e 's/^WEBHOOK_SIGNING_KEY=.*/WEBHOOK_SIGNING_KEY=release-gate-webhook-secret-with-32-characters/' \
            -e 's/^ANALYSIS_MIN_AVAILABLE_MEMORY_GB=.*/ANALYSIS_MIN_AVAILABLE_MEMORY_GB=0/' \
            -e 's/^ANALYSIS_NODE_MIN_FREE_GB=.*/ANALYSIS_NODE_MIN_FREE_GB=0/' \
            -e "s#^MINIWDL_UID=.*#MINIWDL_UID=$worker_uid#" \
            -e "s#^MINIWDL_GID=.*#MINIWDL_GID=$worker_gid#" \
            -e "s#/opt/analysis-node/data#$install_root/data#g" \
            -e "s#/opt/analysis-node-backups#$install_root/backups#g" \
            -e "s#/opt/analysis-node/secrets#$install_root/secrets#g" \
            "$package/.env"
          chmod 0600 "$package/.env"
          dockerd_root="$RUNNER_TEMP/analysis-node-offline-docker-$VERSION"
          dockerd_socket="$dockerd_root/docker.sock"
          mkdir -p "$dockerd_root"
          sudo systemctl stop docker.service docker.socket
          sudo dockerd \
            --host "unix://$dockerd_socket" \
            --data-root "$dockerd_root/data" \
            --exec-root "$dockerd_root/exec" \
            --pidfile "$dockerd_root/dockerd.pid" \
            > "$dockerd_root/dockerd.log" 2>&1 &
          export DOCKER_HOST="unix://$dockerd_socket"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          for _ in {1..60}; do
            if docker info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! docker info >/dev/null 2>&1; then
            cat "$dockerd_root/dockerd.log"
            exit 1
          fi
          test -z "$(docker image ls --all --quiet)"
          "$package/bin/analysis-node" verify-bundle
          PYTHONPATH="$package/reference-connector" \
            python -m reference_connector --help >/dev/null
          "$package/bin/analysis-node" init
          "$package/bin/analysis-node" preflight
          "$package/bin/analysis-node" load-images
          "$package/bin/analysis-node" migrate
          "$package/bin/analysis-node" up
          "$package/bin/analysis-node" doctor --smoke --timeout 600
          analysis_compose() {
            docker compose \
              --project-directory "$package" \
              --env-file "$package/.env" \
              --env-file "$package/images.env" \
              --file "$package/compose.yml" \
              --profile headless \
              --profile isolated-runtime \
              "$@"
          }
          connector_compose() {
            docker compose \
              --project-name "reference-connector-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --project-directory "$package/reference-connector" \
              --env-file "$package/images.env" \
              --file "$package/reference-connector/compose.offline.yml" \
              "$@"
          }
          connector_external_id="connector-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          connector_probe_dir="$install_root/data/workspace/rawdata/.reference-connector-$connector_external_id"
          connector_probe_file="$connector_probe_dir/probe.txt"
          connector_token_prefix=""
          connector_started="0"
          cleanup_reference_connector_smoke() {
            if [[ "$connector_started" == "1" ]]; then
              connector_compose down || true
            fi
            if [[ -n "$connector_token_prefix" ]]; then
              analysis_compose exec -T backend python backend/manage.py manage_service_account \
                --client-id mes-reference \
                --revoke-prefix "$connector_token_prefix" \
                --actor release-gate >/dev/null || true
            fi
            if [[ -f "$connector_probe_file" ]]; then
              chmod u+w "$connector_probe_file" || true
              rm -f "$connector_probe_file"
            fi
            if [[ -d "$connector_probe_dir" ]]; then
              chmod u+w "$connector_probe_dir" || true
              rmdir "$connector_probe_dir" || true
            fi
          }
          trap cleanup_reference_connector_smoke EXIT
          mkdir -m 0750 "$connector_probe_dir"
          printf 'analysis-node-input\n' > "$connector_probe_file"
          chmod 0440 "$connector_probe_file"
          connector_config="$package/reference-connector/config.json"
          connector_order="$RUNNER_TEMP/reference-connector-order-$VERSION.json"
          jq \
            --arg base "http://127.0.0.1:18082/api/v1/integration" \
            --arg database "/var/lib/reference-connector/connector.sqlite3" \
            --arg results "/var/lib/reference-connector/results" \
            '.analysis_api.base_url = $base
             | .listen.host = "127.0.0.1"
             | .state.database = $database
             | .state.result_directory = $results' \
            "$package/reference-connector/config.analysis-node-smoke.example.json" \
            > "$connector_config"
          jq \
            --arg external_id "$connector_external_id" \
            --arg probe ".reference-connector-$connector_external_id/probe.txt" \
            '.order.execution_id = $external_id
             | .order.analysis_id = $external_id
             | .files.probe = $probe' \
            "$package/reference-connector/analysis-node-smoke-order.example.json" \
            > "$connector_order"
          issued=$(analysis_compose exec -T backend python backend/manage.py manage_service_account \
            --client-id mes-reference \
            --name "Reference Connector release gate" \
            --scope workflow:read \
            --scope analysis:submit \
            --scope analysis:read \
            --scope analysis:download \
            --issue-token \
            --token-name release-gate \
            --expires-days 1 \
            --actor release-gate)
          connector_token_prefix=$(sed -n 's/^TOKEN_PREFIX=//p' <<< "$issued")
          connector_upstream_token=$(sed -n 's/^TOKEN=//p' <<< "$issued")
          test -n "$connector_token_prefix"
          test -n "$connector_upstream_token"
          export BIOWORKFLOW_TOKEN="$connector_upstream_token"
          export BIOWORKFLOW_WEBHOOK_SECRET
          BIOWORKFLOW_WEBHOOK_SECRET=$(python -c \
            'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).rstrip(b"=").decode())')
          export REFERENCE_CONNECTOR_INBOUND_TOKEN
          REFERENCE_CONNECTOR_INBOUND_TOKEN=$(python -c \
            'import secrets; print(secrets.token_urlsafe(32))')
          connector_compose build
          connector_compose up -d
          connector_started="1"
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8090/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            http://127.0.0.1:8090/health >/dev/null
          connector_api() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $REFERENCE_CONNECTOR_INBOUND_TOKEN" \
              --header "Content-Type: application/json" \
              "$@"
          }
          products=$(connector_api http://127.0.0.1:8090/v1/products)
          connector_contract_digest=$(jq -r \
            '.results[]
             | select(.analysis_code == "analysis-node-smoke" and .contract_version == "1.0.0")
             | .contract_digest' <<< "$products")
          [[ "$connector_contract_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq --arg digest "$connector_contract_digest" \
            '.mapping.analysis_product.expected_contract_digest = $digest' \
            "$connector_config" > "$connector_config.pinned"
          mv "$connector_config.pinned" "$connector_config"
          connector_compose up -d --force-recreate
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8090/health >/dev/null; then
              break
            fi
            sleep 1
          done
          submitted=$(connector_api \
            --request POST \
            --data-binary "@$connector_order" \
            http://127.0.0.1:8090/v1/orders)
          connector_run_id=$(jq -r '.id // empty' <<< "$submitted")
          test -n "$connector_run_id"
          replayed=$(connector_api \
            --request POST \
            --data-binary "@$connector_order" \
            http://127.0.0.1:8090/v1/orders)
          test "$(jq -r '.id // empty' <<< "$replayed")" = "$connector_run_id"
          connector_status=""
          for _ in {1..150}; do
            if current=$(connector_api \
              --request POST \
              --data '{}' \
              "http://127.0.0.1:8090/v1/orders/$connector_external_id/reconcile"); then
              connector_status=$(jq -r '.status // empty' <<< "$current")
              if [[ "$connector_status" == succeeded ]]; then
                break
              fi
              if [[ "$connector_status" == failed || "$connector_status" == canceled ]]; then
                echo "Reference Connector smoke reached $connector_status" >&2
                exit 1
              fi
            fi
            sleep 2
          done
          test "$connector_status" = succeeded
          collected=$(connector_api \
            --request POST \
            --data '{}' \
            "http://127.0.0.1:8090/v1/orders/$connector_external_id/results")
          collected_again=$(connector_api \
            --request POST \
            --data '{}' \
            "http://127.0.0.1:8090/v1/orders/$connector_external_id/results")
          connector_result_digest=$(jq -r '.result_digest // empty' <<< "$collected")
          test -n "$connector_result_digest"
          test "$(jq -r '.result_digest // empty' <<< "$collected_again")" = "$connector_result_digest"
          connector_download_url=$(jq -r '.outputs[0].download_url // empty' <<< "$collected")
          connector_expected_sha256=$(jq -r '.outputs[0].sha256 // empty' <<< "$collected")
          test -n "$connector_download_url"
          [[ "$connector_expected_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          connector_download="$RUNNER_TEMP/reference-connector-result-$VERSION.txt"
          connector_api \
            --output "$connector_download" \
            "http://127.0.0.1:8090$connector_download_url"
          python -c \
            'from pathlib import Path; import hashlib,sys; body = Path(sys.argv[1]).read_bytes(); assert body.strip() == b"analysis-node-ok"; assert "sha256:" + hashlib.sha256(body).hexdigest() == sys.argv[2]' \
            "$connector_download" "$connector_expected_sha256"
          cleanup_reference_connector_smoke
          trap - EXIT
          unset BIOWORKFLOW_TOKEN BIOWORKFLOW_WEBHOOK_SECRET REFERENCE_CONNECTOR_INBOUND_TOKEN
          analysis_compose exec -T backend python backend/manage.py shell -c \
            'from workflows.models import WorkflowDocument; WorkflowDocument.objects.update_or_create(slug="release-restore-sentinel", defaults={"name": "before-backup"})'
          backup_json=$("$package/bin/analysis-node" --json backup)
          backup_path=$(jq -r '.checks[] | select(.name == "database-backup") | .message | sub("^备份已创建："; "")' <<< "$backup_json")
          test -f "$backup_path"
          analysis_compose exec -T backend python backend/manage.py shell -c \
            'from workflows.models import WorkflowDocument; updated = WorkflowDocument.objects.filter(slug="release-restore-sentinel").update(name="after-backup"); assert updated == 1'
          "$package/bin/analysis-node" restore "$backup_path" --confirm-database-restore
          "$package/bin/analysis-node" up
          analysis_compose exec -T backend python backend/manage.py shell -c \
            'from workflows.models import WorkflowDocument; assert WorkflowDocument.objects.filter(slug="release-restore-sentinel", name="before-backup").exists()'
          "$package/bin/analysis-node" doctor --smoke --timeout 600

      - name: Stop release-gate services without deleting data
        if: always()
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          package="$RUNNER_TEMP/analysis-node-offline-$VERSION/analysis-node-$VERSION"
          if [[ -x "$package/bin/analysis-node" && -f "$package/.env" ]]; then
            "$package/bin/analysis-node" down || true
          fi
          dockerd_root="$RUNNER_TEMP/analysis-node-offline-docker-$VERSION"
          if [[ -f "$dockerd_root/dockerd.pid" ]]; then
            sudo kill "$(cat "$dockerd_root/dockerd.pid")" || true
          fi
          unset DOCKER_HOST
          sudo systemctl start docker.service || true

      - name: Upload delivery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-node-${{ steps.version.outputs.value }}-linux-amd64
          path: |
            dist/analysis-node-${{ steps.version.outputs.value }}-linux-amd64.tar.gz
            dist/analysis-node-${{ steps.version.outputs.value }}-linux-amd64.tar.gz.sha256
            dist/analysis-node-${{ steps.version.outputs.value }}-linux-amd64.tar.gz.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release for a release tag
        if: startsWith(github.ref, 'refs/tags/analysis-node-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/analysis-node-$VERSION-linux-amd64.tar.gz"
          "dist/analysis-node-$VERSION-linux-amd64.tar.gz.sha256"
          "dist/analysis-node-$VERSION-linux-amd64.tar.gz.sigstore.json"
          --verify-tag
          --generate-notes
          --title "Analysis Node $VERSION"
