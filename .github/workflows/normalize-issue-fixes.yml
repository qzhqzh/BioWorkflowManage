name: Normalize issue fixes

on:
  push:
    branches:
      - agent/fix-reported-issues

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move fixes into their canonical modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match in {path}, found {count}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "backend/workflows/views.py",
              "from django.db.models import Max\n",
              "from django.db.models import Count, Max, OuterRef, Subquery\n",
          )
          replace_once(
              "backend/workflows/views.py",
              '''    WorkflowDocument,
    WorkflowVersion,
)


ROOT = Path(__file__).resolve().parents[2]
''',
              '''    WorkflowDocument,
    WorkflowVersion,
)
from .request_ids import request_id as _request_id
from .request_ids import with_request_id as _with_request_id


ROOT = Path(__file__).resolve().parents[2]
''',
          )
          replace_once(
              "backend/workflows/views.py",
              '''def _request_id(request) -> str:
    candidate = request.headers.get("X-Request-ID", "")
    if candidate and len(candidate) <= 128 and candidate.replace("-", "_").isalnum():
        return candidate
    return f"req_{uuid.uuid4().hex}"


def _with_request_id(response: Response, request_id: str) -> Response:
    response["X-Request-ID"] = request_id
    return response


''',
              "",
          )
          replace_once(
              "backend/workflows/views.py",
              '''@api_view(["GET"])
def tools(request):
    request_id = _request_id(request)
    results = []
    tool_ids = sorted(
        set(ToolVersion.objects.values_list("tool_id", flat=True))
        | set(ToolDocument.objects.values_list("tool_id", flat=True))
    )
    for tool_id in tool_ids:
        latest = ToolVersion.objects.filter(tool_id=tool_id).first()
        draft = ToolDocument.objects.filter(tool_id=tool_id).first()
        results.append(
            {
                "tool_id": tool_id,
                "name": (
                    (draft.draft_spec.get("display_name") or draft.draft_spec.get("name"))
                    if draft
                    else latest.name
                ),
                "latest_version": latest.version if latest else None,
                "latest_digest": latest.digest if latest else None,
                "latest_created_at": latest.created_at.isoformat() if latest else None,
                "version_count": ToolVersion.objects.filter(tool_id=tool_id).count(),
                "draft_status": (
                    draft.validation.get("status", "unknown") if draft else None
                ),
                "draft_updated_at": draft.updated_at.isoformat() if draft else None,
            }
        )
    return _with_request_id(Response({"results": results}), request_id)
''',
              '''@api_view(["GET"])
def tools(request):
    request_id = _request_id(request)
    latest_version_pk = (
        ToolVersion.objects.filter(tool_id=OuterRef("tool_id"))
        .order_by("-created_at", "-pk")
        .values("pk")[:1]
    )
    latest_map = {
        item.tool_id: item
        for item in ToolVersion.objects.filter(pk=Subquery(latest_version_pk))
    }
    version_counts = {
        item["tool_id"]: item["version_count"]
        for item in ToolVersion.objects.values("tool_id")
        .annotate(version_count=Count("id"))
        .order_by()
    }
    draft_map = {item.tool_id: item for item in ToolDocument.objects.all()}
    tool_ids = sorted(set(latest_map) | set(draft_map))
    results = []
    for tool_id in tool_ids:
        latest = latest_map.get(tool_id)
        draft = draft_map.get(tool_id)
        results.append(
            {
                "tool_id": tool_id,
                "name": (
                    (draft.draft_spec.get("display_name") or draft.draft_spec.get("name"))
                    if draft
                    else latest.name
                ),
                "latest_version": latest.version if latest else None,
                "latest_digest": latest.digest if latest else None,
                "latest_created_at": latest.created_at.isoformat() if latest else None,
                "version_count": version_counts.get(tool_id, 0),
                "draft_status": (
                    draft.validation.get("status", "unknown") if draft else None
                ),
                "draft_updated_at": draft.updated_at.isoformat() if draft else None,
            }
        )
    return _with_request_id(Response({"results": results}), request_id)
''',
          )

          replace_once(
              "backend/workflows/wdl_assets.py",
              '''from .models import WDLAuditEvent, WDLAsset, WDLSourceRevision, WDLTag


MAX_WDL_CONTENT_LENGTH = 2_000_000
''',
              '''from .models import WDLAuditEvent, WDLAsset, WDLSourceRevision, WDLTag
from .request_ids import request_id as _request_id
from .request_ids import with_request_id as _with_request_id


MAX_WDL_CONTENT_LENGTH = 2_000_000
''',
          )
          replace_once(
              "backend/workflows/wdl_assets.py",
              '''def _request_id(request) -> str:
    candidate = request.headers.get("X-Request-ID", "")
    if candidate and len(candidate) <= 128 and candidate.replace("-", "_").isalnum():
        return candidate
    return f"req_{uuid.uuid4().hex}"


def _with_request_id(response: Response, request_id: str) -> Response:
    response["X-Request-ID"] = request_id
    return response


''',
              "",
          )

          Path("backend/workflows/urls.py").write_text(
              '''from django.urls import path

from . import views, wdl_assets


urlpatterns = [
    path("health", views.health),
    path("contracts", views.contracts),
    path("contracts/<str:contract_name>", views.contracts),
    path("validations/tool-spec", views.validate_tool),
    path("validations/workflow-graph", views.validate_graph),
    path("compilations", views.compile_graph),
    path("tools", views.tools),
    path("tools/<str:tool_id>/drafts", views.tool_document),
    path("tools/<path:tool_id>/publish", views.publish_tool_document),
    path("tools/<path:tool_id>/versions", views.tool_versions),
    path(
        "tools/<path:tool_id>/versions/<str:version>",
        views.tool_version_detail,
    ),
    path("tools/<str:tool_id>", views.tool_document),
    path("wdl-assets", wdl_assets.wdl_assets),
    path("wdl-assets/tags", wdl_assets.wdl_tags),
    path("wdl-assets/tags/<int:tag_id>", wdl_assets.wdl_tag_detail),
    path("wdl-assets/<slug:slug>", wdl_assets.wdl_asset_detail),
    path(
        "wdl-assets/<slug:slug>/revisions",
        wdl_assets.wdl_asset_revisions,
    ),
    path(
        "wdl-assets/<slug:slug>/revisions/<int:version>",
        wdl_assets.wdl_asset_revision_detail,
    ),
    path(
        "wdl-assets/<slug:slug>/format",
        wdl_assets.format_wdl_asset,
    ),
    path("editor/workflows", views.workflow_documents),
    path("editor/workflows/<slug:slug>", views.workflow_document),
    path("editor/workflows/<slug:slug>/versions", views.workflow_versions),
    path(
        "editor/workflows/<slug:slug>/versions/<int:version>",
        views.workflow_version_detail,
    ),
    path("editor/workflows/<slug:slug>/compilations", views.compilation_history),
    path("editor/workflows/<slug:slug>/wdl-versions", views.wdl_revisions),
    path(
        "editor/workflows/<slug:slug>/wdl-versions/<int:version>",
        views.wdl_revision_detail,
    ),
    # Compatibility alias retained for clients built against the phase-2 preview.
    path("editor/workflows/<slug:slug>/wdl-revisions", views.wdl_revisions),
    path(
        "editor/workflows/<slug:slug>/wdl-revisions/<int:version>",
        views.wdl_revision_detail,
    ),
]
''',
              encoding="utf-8",
          )
          Path("backend/workflows/api_overrides.py").unlink()
          Path(".github/workflows/normalize-issue-fixes.yml").unlink()
          PY

      - name: Check syntax and publish normalized sources
        shell: bash
        run: |
          python -m compileall -q backend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize request helpers in source modules"
          git push origin HEAD:${{ github.ref_name }}
