name: Apply reported issue fixes

on:
  push:
    branches:
      - agent/fix-reported-issues

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Apply fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one match in {path}, found {count}: {old[:80]!r}"
                  )
              file_path.write_text(content.replace(old, new, 1), encoding="utf-8")


          settings_path = Path("backend/config/settings.py")
          settings_path.write_text(
              '''from __future__ import annotations

