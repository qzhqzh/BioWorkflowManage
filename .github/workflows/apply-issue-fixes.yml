name: Apply reported issue fixes

on:
  push:
    branches:
      - agent/fix-reported-issues

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Execute repair program stored on branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-issue-fixes.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Refresh locked dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          program = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(program, "apply_issue_fixes.py", "exec"))
          PY

      - name: Refresh locked dependencies
        run: uv lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run focused validation
        run: |
          uvx --from ruff==0.15.14 ruff check backend scripts/miniwdl_runtime.py
          uv run pytest backend/tests/test_reported_issue_regressions.py
          uv run python backend/manage.py check

      - name: Validate backend image
        run: docker build --file Dockerfile.backend --tag bioworkflow-backend:issue-fixes .

      - name: Remove one-shot workflow and commit fixes
        shell: bash
        run: |
          rm .github/workflows/apply-issue-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve reported repository issues"
          git push origin HEAD:${{ github.ref_name }}
