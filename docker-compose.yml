services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioworkflow} -d ${POSTGRES_DB:-bioworkflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],wdl.qzhqzh.com}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-https://wdl.qzhqzh.com,http://localhost:8082,http://127.0.0.1:8082}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://wdl.qzhqzh.com,http://localhost:3000,http://127.0.0.1:3000}"
      DJANGO_AUTH_REQUIRED: "${DJANGO_AUTH_REQUIRED:-1}"
      DJANGO_SEED_USERS: "${DJANGO_SEED_USERS:-0}"
      DJANGO_SEED_DEMO: "${DJANGO_SEED_DEMO:-0}"
      DJANGO_SEED_ALLOW_DEFAULT_PASSWORDS: "${DJANGO_SEED_ALLOW_DEFAULT_PASSWORDS:-0}"
      ANALYSIS_RAWDATA_ROOT: /analysis/rawdata
      ANALYSIS_RAWDATA_EXECUTION_ROOT: ${ANALYSIS_RAWDATA_EXECUTION_ROOT:-/analysis/rawdata}
      ANALYSIS_DATABASE_ROOT: /analysis/databases
      ANALYSIS_DATABASE_CATALOG: /analysis/databases/catalog.json
      ANALYSIS_DATABASE_EXECUTION_ROOT: ${ANALYSIS_DATABASE_EXECUTION_ROOT:-/analysis/databases}
      ANALYSIS_RUN_ROOT: /analysis/runs
    volumes:
      - ${ANALYSIS_RAWDATA_HOST_PATH:-./workspace/rawdata}:/analysis/rawdata:ro
      - ${ANALYSIS_DATABASE_HOST_PATH:-./workspace/databases}:/analysis/databases:ro
      - ${ANALYSIS_RUN_HOST_PATH:-./data/analysis-runs}:/analysis/runs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  miniwdl-check:
    profiles: ["wdl-check"]
    image: bioworkflowmanage-miniwdl:1.14.2
    build:
      context: .
      dockerfile: Dockerfile.miniwdl
    network_mode: none
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      MINIWDL_RUN_ROOT: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    volumes:
      - .:/workspace:ro
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  miniwdl-docker:
    profiles: ["wdl-runtime"]
    image: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    hostname: miniwdl-docker
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - ./data/miniwdl-engine:/var/lib/docker
      - ./data/miniwdl-certs:/certs
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
      - ${ANALYSIS_RAWDATA_HOST_PATH:-./workspace/rawdata}:/analysis/rawdata:ro
      - ${ANALYSIS_DATABASE_HOST_PATH:-./workspace/databases}:/analysis/databases:ro
      - ${ANALYSIS_RUN_HOST_PATH:-./data/analysis-runs}:/analysis/runs
    networks:
      - miniwdl-control
      - miniwdl-egress
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///var/run/docker.sock", "info"]
      interval: 3s
      timeout: 3s
      retries: 30

  miniwdl-runner:
    profiles: ["wdl-runtime"]
    image: bioworkflowmanage-miniwdl:1.14.2
    build:
      context: .
      dockerfile: Dockerfile.miniwdl
    depends_on:
      miniwdl-docker:
        condition: service_healthy
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      DOCKER_HOST: tcp://miniwdl-docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      MINIWDL_RUN_ROOT: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    volumes:
      - .:/workspace:ro
      - ./data/miniwdl-certs/client:/certs/client:ro
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    networks:
      - miniwdl-control
      - miniwdl-egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  analysis-worker:
    profiles: ["wdl-runtime"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "backend/manage.py", "run_analysis_worker"]
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DOCKER_HOST: tcp://miniwdl-docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      MINIWDL_RUN_ROOT: /analysis
      ANALYSIS_RAWDATA_ROOT: /analysis/rawdata
      ANALYSIS_DATABASE_ROOT: /analysis/databases
      ANALYSIS_DATABASE_CATALOG: /analysis/databases/catalog.json
      ANALYSIS_RUN_ROOT: /analysis/runs
      ANALYSIS_WORKER_POLL_SECONDS: "${ANALYSIS_WORKER_POLL_SECONDS:-2}"
      ANALYSIS_MIN_AVAILABLE_MEMORY_GB: "${ANALYSIS_MIN_AVAILABLE_MEMORY_GB:-40}"
      ANALYSIS_INFRASTRUCTURE_RETRIES: "${ANALYSIS_INFRASTRUCTURE_RETRIES:-0}"
      ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS: "${ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS:-15}"
    depends_on:
      db:
        condition: service_healthy
      miniwdl-docker:
        condition: service_healthy
    volumes:
      - ${ANALYSIS_RAWDATA_HOST_PATH:-./workspace/rawdata}:/analysis/rawdata:ro
      - ${ANALYSIS_DATABASE_HOST_PATH:-./workspace/databases}:/analysis/databases:ro
      - ${ANALYSIS_RUN_HOST_PATH:-./data/analysis-runs}:/analysis/runs
      - ${ANALYSIS_CACHE_HOST_PATH:-./data/analysis-cache}:/analysis/cache
      - ./data/miniwdl-certs/client:/certs/client:ro
    tmpfs:
      - /tmp
    networks:
      - default
      - miniwdl-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  analysis-worker-host:
    profiles: ["wdl-host-runtime"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "backend/manage.py", "run_analysis_worker"]
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    group_add:
      - "${MINIWDL_DOCKER_GID:?Run stat -c '%g' /var/run/docker.sock and set MINIWDL_DOCKER_GID}"
    read_only: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DOCKER_HOST: unix:///var/run/docker.sock
      MINIWDL_RUN_ROOT: ${ANALYSIS_WORKSPACE_HOST_PATH:-/mnt/nas/workspace}
      MINIWDL__CALL_CACHE__DIR: ${ANALYSIS_CACHE_HOST_PATH:-/mnt/nas/workspace/analysis-cache}/calls
      ANALYSIS_RAWDATA_ROOT: ${ANALYSIS_RAWDATA_HOST_PATH:-/mnt/nas/workspace/rawdata}
      ANALYSIS_DATABASE_ROOT: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}
      ANALYSIS_DATABASE_CATALOG: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}/catalog.json
      ANALYSIS_RUN_ROOT: ${ANALYSIS_RUN_HOST_PATH:-/mnt/nas/workspace/analysis-runs}
      ANALYSIS_WORKER_POLL_SECONDS: "${ANALYSIS_WORKER_POLL_SECONDS:-2}"
      ANALYSIS_MIN_AVAILABLE_MEMORY_GB: "${ANALYSIS_MIN_AVAILABLE_MEMORY_GB:-40}"
      ANALYSIS_INFRASTRUCTURE_RETRIES: "${ANALYSIS_INFRASTRUCTURE_RETRIES:-0}"
      ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS: "${ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS:-15}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${ANALYSIS_RAWDATA_HOST_PATH:-/mnt/nas/workspace/rawdata}
        target: ${ANALYSIS_RAWDATA_HOST_PATH:-/mnt/nas/workspace/rawdata}
        read_only: true
      - type: bind
        source: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}
        target: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}
        read_only: true
      - type: bind
        source: ${ANALYSIS_RUN_HOST_PATH:-/mnt/nas/workspace/analysis-runs}
        target: ${ANALYSIS_RUN_HOST_PATH:-/mnt/nas/workspace/analysis-runs}
      - type: bind
        source: ${ANALYSIS_CACHE_HOST_PATH:-/mnt/nas/workspace/analysis-cache}
        target: ${ANALYSIS_CACHE_HOST_PATH:-/mnt/nas/workspace/analysis-cache}
    tmpfs:
      - /tmp
    networks:
      - default
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  miniwdl-control:
    internal: true
    ipam:
      config:
        - subnet: ${MINIWDL_CONTROL_SUBNET:-10.253.0.0/24}
  miniwdl-egress:
    ipam:
      config:
        - subnet: ${MINIWDL_EGRESS_SUBNET:-10.253.1.0/24}
