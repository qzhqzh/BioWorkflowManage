services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioworkflow-dev-only}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioworkflow} -d ${POSTGRES_DB:-bioworkflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioworkflow-dev-only}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  miniwdl-check:
    profiles: ["wdl-check"]
    image: bioworkflowmanage-miniwdl:1.14.2
    build:
      context: .
      dockerfile: Dockerfile.miniwdl
    network_mode: none
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      MINIWDL_RUN_ROOT: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    volumes:
      - .:/workspace:ro
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  miniwdl-docker:
    profiles: ["wdl-runtime"]
    image: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    hostname: miniwdl-docker
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - ./data/miniwdl-engine:/var/lib/docker
      - ./data/miniwdl-certs:/certs
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    networks:
      - miniwdl-control
      - miniwdl-egress
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///var/run/docker.sock", "info"]
      interval: 3s
      timeout: 3s
      retries: 30

  miniwdl-runner:
    profiles: ["wdl-runtime"]
    image: bioworkflowmanage-miniwdl:1.14.2
    build:
      context: .
      dockerfile: Dockerfile.miniwdl
    depends_on:
      miniwdl-docker:
        condition: service_healthy
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      DOCKER_HOST: tcp://miniwdl-docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      MINIWDL_RUN_ROOT: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    volumes:
      - .:/workspace:ro
      - ./data/miniwdl-certs/client:/certs/client:ro
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    networks:
      - miniwdl-control
      - miniwdl-egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  miniwdl-control:
    internal: true
    ipam:
      config:
        - subnet: ${MINIWDL_CONTROL_SUBNET:-10.253.0.0/24}
  miniwdl-egress:
    ipam:
      config:
        - subnet: ${MINIWDL_EGRESS_SUBNET:-10.253.1.0/24}
