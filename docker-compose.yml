services:
  db:
    image: m.daocloud.io/docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioworkflow} -d ${POSTGRES_DB:-bioworkflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      WEBHOOK_SIGNING_KEY: "${WEBHOOK_SIGNING_KEY:-}"
      WEBHOOK_ALLOWED_HTTP_HOSTS: "${WEBHOOK_ALLOWED_HTTP_HOSTS:-}"
      WEBHOOK_PRIVATE_HOST_ALLOWLIST: "${WEBHOOK_PRIVATE_HOST_ALLOWLIST:-}"
      WEBHOOK_DELIVERY_TIMEOUT_SECONDS: "${WEBHOOK_DELIVERY_TIMEOUT_SECONDS:-10}"
      WEBHOOK_MAX_ATTEMPTS: "${WEBHOOK_MAX_ATTEMPTS:-8}"
      WEBHOOK_BACKOFF_BASE_SECONDS: "${WEBHOOK_BACKOFF_BASE_SECONDS:-5}"
      WEBHOOK_BACKOFF_MAX_SECONDS: "${WEBHOOK_BACKOFF_MAX_SECONDS:-3600}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],wdl.qzhqzh.com}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-https://wdl.qzhqzh.com,http://localhost:8082,http://127.0.0.1:8082}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://wdl.qzhqzh.com,http://localhost:3000,http://127.0.0.1:3000}"
      DJANGO_AUTH_REQUIRED: "${DJANGO_AUTH_REQUIRED:-1}"
      DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-1}"
      DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-1}"
      DJANGO_LOGIN_THROTTLE_RATE: "${DJANGO_LOGIN_THROTTLE_RATE:-30/min}"
      DJANGO_LOGIN_THROTTLE_RETENTION_DAYS: "${DJANGO_LOGIN_THROTTLE_RETENTION_DAYS:-7}"
      DJANGO_TRUSTED_PROXY_COUNT: "${DJANGO_TRUSTED_PROXY_COUNT:-1}"
      DJANGO_SEED_USERS: "${DJANGO_SEED_USERS:-0}"
      DJANGO_SEED_DEMO: "${DJANGO_SEED_DEMO:-0}"
      DJANGO_SEED_ALLOW_DEFAULT_PASSWORDS: "${DJANGO_SEED_ALLOW_DEFAULT_PASSWORDS:-0}"
      ANALYSIS_RAWDATA_ROOT: /analysis/rawdata
      RAWDATA_SCAN_BATCH_ENTRIES: "${RAWDATA_SCAN_BATCH_ENTRIES:-1000}"
      RAWDATA_SCAN_MAX_FILES: "${RAWDATA_SCAN_MAX_FILES:-20000}"
      RAWDATA_SCAN_MAX_ENTRIES: "${RAWDATA_SCAN_MAX_ENTRIES:-100000}"
      RAWDATA_SCAN_MAX_DEPTH: "${RAWDATA_SCAN_MAX_DEPTH:-8}"
      RAWDATA_SCAN_BATCH_SECONDS: "${RAWDATA_SCAN_BATCH_SECONDS:-2}"
      ANALYSIS_RESOURCE_MANIFEST_TIMEOUT_SECONDS: "${ANALYSIS_RESOURCE_MANIFEST_TIMEOUT_SECONDS:-2}"
      ANALYSIS_WORKER_RESOURCE_MANIFEST_TIMEOUT_SECONDS: "${ANALYSIS_WORKER_RESOURCE_MANIFEST_TIMEOUT_SECONDS:-300}"
      ANALYSIS_RESOURCE_MANIFEST_MAX_ENTRIES: "${ANALYSIS_RESOURCE_MANIFEST_MAX_ENTRIES:-100000}"
      ANALYSIS_RESOURCE_MANIFEST_MAX_DEPTH: "${ANALYSIS_RESOURCE_MANIFEST_MAX_DEPTH:-128}"
      ANALYSIS_MANAGED_RESOURCE_MAX_ITEMS: "${ANALYSIS_MANAGED_RESOURCE_MAX_ITEMS:-256}"
      ANALYSIS_INPUT_TEXT_LINE_MAX_CHARS: "${ANALYSIS_INPUT_TEXT_LINE_MAX_CHARS:-1048576}"
      ANALYSIS_INPUT_GZIP_HEADER_MAX_BYTES: "${ANALYSIS_INPUT_GZIP_HEADER_MAX_BYTES:-65536}"
      ANALYSIS_MANAGED_FILE_CHECKSUM_MAX_BYTES: "${ANALYSIS_MANAGED_FILE_CHECKSUM_MAX_BYTES:-17179869184}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_ITEMS: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_ITEMS:-256}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_BYTES: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_BYTES:-1099511627776}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_DIRECTORY_ENTRIES: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_DIRECTORY_ENTRIES:-200000}"
      ANALYSIS_OUTPUT_SNAPSHOT_TIMEOUT_SECONDS: "${ANALYSIS_OUTPUT_SNAPSHOT_TIMEOUT_SECONDS:-300}"
      ANALYSIS_OUTPUT_SNAPSHOT_MIN_FREE_BYTES: "${ANALYSIS_OUTPUT_SNAPSHOT_MIN_FREE_BYTES:-1073741824}"
      ANALYSIS_OUTPUT_MANIFEST_MAX_DEPTH: "${ANALYSIS_OUTPUT_MANIFEST_MAX_DEPTH:-32}"
      ANALYSIS_OUTPUT_VALUE_MAX_BYTES: "${ANALYSIS_OUTPUT_VALUE_MAX_BYTES:-65536}"
      ANALYSIS_RESULT_JSON_MAX_BYTES: "${ANALYSIS_RESULT_JSON_MAX_BYTES:-67108864}"
      RAWDATA_INDEX_INTERVAL_SECONDS: "${RAWDATA_INDEX_INTERVAL_SECONDS:-300}"
      RAWDATA_INDEX_STALE_SECONDS: "${RAWDATA_INDEX_STALE_SECONDS:-900}"
      ANALYSIS_RAWDATA_EXECUTION_ROOT: ${ANALYSIS_RAWDATA_EXECUTION_ROOT:-/analysis/rawdata}
      ANALYSIS_DATABASE_ROOT: /analysis/databases
      ANALYSIS_DATABASE_CATALOG: /analysis/databases/catalog.json
      ANALYSIS_DATABASE_EXECUTION_ROOT: ${ANALYSIS_DATABASE_EXECUTION_ROOT:-/analysis/databases}
      ANALYSIS_RUN_ROOT: /analysis/runs
      ANALYSIS_RUN_EXECUTION_ROOT: ${ANALYSIS_RUN_EXECUTION_ROOT:-/analysis/runs}
    volumes:
      - ${ANALYSIS_RAWDATA_HOST_PATH:-./workspace/rawdata}:/analysis/rawdata:ro
      - ${ANALYSIS_DATABASE_HOST_PATH:-./workspace/databases}:/analysis/databases:ro
      - ${ANALYSIS_RUN_HOST_PATH:-./data/analysis-runs}:/analysis/runs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  rawdata-indexer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "backend/manage.py", "run_rawdata_indexer"]
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      ANALYSIS_RAWDATA_ROOT: /analysis/rawdata
      RAWDATA_SCAN_BATCH_ENTRIES: "${RAWDATA_SCAN_BATCH_ENTRIES:-1000}"
      RAWDATA_SCAN_MAX_FILES: "${RAWDATA_SCAN_MAX_FILES:-20000}"
      RAWDATA_SCAN_MAX_ENTRIES: "${RAWDATA_SCAN_MAX_ENTRIES:-100000}"
      RAWDATA_SCAN_MAX_DEPTH: "${RAWDATA_SCAN_MAX_DEPTH:-8}"
      RAWDATA_SCAN_BATCH_SECONDS: "${RAWDATA_SCAN_BATCH_SECONDS:-2}"
      RAWDATA_INDEX_INTERVAL_SECONDS: "${RAWDATA_INDEX_INTERVAL_SECONDS:-300}"
      RAWDATA_INDEX_STALE_SECONDS: "${RAWDATA_INDEX_STALE_SECONDS:-900}"
    volumes:
      - ${ANALYSIS_RAWDATA_HOST_PATH:-./workspace/rawdata}:/analysis/rawdata:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  webhook-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "backend/manage.py", "run_webhook_dispatcher"]
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      WEBHOOK_SIGNING_KEY: "${WEBHOOK_SIGNING_KEY:-}"
      WEBHOOK_ALLOWED_HTTP_HOSTS: "${WEBHOOK_ALLOWED_HTTP_HOSTS:-}"
      WEBHOOK_PRIVATE_HOST_ALLOWLIST: "${WEBHOOK_PRIVATE_HOST_ALLOWLIST:-}"
      WEBHOOK_DELIVERY_TIMEOUT_SECONDS: "${WEBHOOK_DELIVERY_TIMEOUT_SECONDS:-10}"
      WEBHOOK_DELIVERY_POLL_SECONDS: "${WEBHOOK_DELIVERY_POLL_SECONDS:-2}"
      WEBHOOK_DELIVERY_LEASE_SECONDS: "${WEBHOOK_DELIVERY_LEASE_SECONDS:-60}"
      WEBHOOK_MAX_ATTEMPTS: "${WEBHOOK_MAX_ATTEMPTS:-8}"
      WEBHOOK_BACKOFF_BASE_SECONDS: "${WEBHOOK_BACKOFF_BASE_SECONDS:-5}"
      WEBHOOK_BACKOFF_MAX_SECONDS: "${WEBHOOK_BACKOFF_MAX_SECONDS:-3600}"
      WEBHOOK_RESPONSE_MAX_BYTES: "${WEBHOOK_RESPONSE_MAX_BYTES:-2048}"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    image: m.daocloud.io/docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  miniwdl-check:
    profiles: ["wdl-check"]
    image: bioworkflowmanage-miniwdl:1.14.2
    build:
      context: .
      dockerfile: Dockerfile.miniwdl
    network_mode: none
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      MINIWDL_RUN_ROOT: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    volumes:
      - .:/workspace:ro
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  miniwdl-docker:
    profiles: ["wdl-runtime"]
    image: m.daocloud.io/docker.io/library/docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    hostname: miniwdl-docker
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - ./data/miniwdl-engine:/var/lib/docker
      - ./data/miniwdl-certs:/certs
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
      - ${ANALYSIS_RAWDATA_HOST_PATH:-./workspace/rawdata}:/analysis/rawdata:ro
      - ${ANALYSIS_DATABASE_HOST_PATH:-./workspace/databases}:/analysis/databases:ro
      - ${ANALYSIS_RUN_HOST_PATH:-./data/analysis-runs}:/analysis/runs
    networks:
      - miniwdl-control
      - miniwdl-egress
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///var/run/docker.sock", "info"]
      interval: 3s
      timeout: 3s
      retries: 30

  miniwdl-runner:
    profiles: ["wdl-runtime"]
    image: bioworkflowmanage-miniwdl:1.14.2
    build:
      context: .
      dockerfile: Dockerfile.miniwdl
    depends_on:
      miniwdl-docker:
        condition: service_healthy
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      DOCKER_HOST: tcp://miniwdl-docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      MINIWDL_RUN_ROOT: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    volumes:
      - .:/workspace:ro
      - ./data/miniwdl-certs/client:/certs/client:ro
      - type: bind
        source: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
        target: ${MINIWDL_RUN_ROOT:-/tmp/bioworkflow-miniwdl}
    networks:
      - miniwdl-control
      - miniwdl-egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  analysis-worker:
    profiles: ["wdl-runtime"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "backend/manage.py", "run_analysis_worker"]
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    read_only: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DOCKER_HOST: tcp://miniwdl-docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      MINIWDL_RUN_ROOT: /analysis
      ANALYSIS_RAWDATA_ROOT: /analysis/rawdata
      ANALYSIS_DATABASE_ROOT: /analysis/databases
      ANALYSIS_DATABASE_CATALOG: /analysis/databases/catalog.json
      ANALYSIS_RUN_ROOT: /analysis/runs
      ANALYSIS_RESOURCE_MANIFEST_MAX_ENTRIES: "${ANALYSIS_RESOURCE_MANIFEST_MAX_ENTRIES:-100000}"
      ANALYSIS_RESOURCE_MANIFEST_MAX_DEPTH: "${ANALYSIS_RESOURCE_MANIFEST_MAX_DEPTH:-128}"
      ANALYSIS_WORKER_RESOURCE_MANIFEST_TIMEOUT_SECONDS: "${ANALYSIS_WORKER_RESOURCE_MANIFEST_TIMEOUT_SECONDS:-300}"
      ANALYSIS_MANAGED_RESOURCE_MAX_ITEMS: "${ANALYSIS_MANAGED_RESOURCE_MAX_ITEMS:-256}"
      ANALYSIS_MANAGED_FILE_CHECKSUM_MAX_BYTES: "${ANALYSIS_MANAGED_FILE_CHECKSUM_MAX_BYTES:-17179869184}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_ITEMS: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_ITEMS:-256}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_BYTES: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_BYTES:-1099511627776}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_DIRECTORY_ENTRIES: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_DIRECTORY_ENTRIES:-200000}"
      ANALYSIS_OUTPUT_SNAPSHOT_TIMEOUT_SECONDS: "${ANALYSIS_OUTPUT_SNAPSHOT_TIMEOUT_SECONDS:-300}"
      ANALYSIS_OUTPUT_SNAPSHOT_MIN_FREE_BYTES: "${ANALYSIS_OUTPUT_SNAPSHOT_MIN_FREE_BYTES:-1073741824}"
      ANALYSIS_OUTPUT_MANIFEST_MAX_DEPTH: "${ANALYSIS_OUTPUT_MANIFEST_MAX_DEPTH:-32}"
      ANALYSIS_OUTPUT_VALUE_MAX_BYTES: "${ANALYSIS_OUTPUT_VALUE_MAX_BYTES:-65536}"
      ANALYSIS_RESULT_JSON_MAX_BYTES: "${ANALYSIS_RESULT_JSON_MAX_BYTES:-67108864}"
      ANALYSIS_WORKER_POLL_SECONDS: "${ANALYSIS_WORKER_POLL_SECONDS:-2}"
      ANALYSIS_MIN_AVAILABLE_MEMORY_GB: "${ANALYSIS_MIN_AVAILABLE_MEMORY_GB:-40}"
      ANALYSIS_INFRASTRUCTURE_RETRIES: "${ANALYSIS_INFRASTRUCTURE_RETRIES:-0}"
      ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS: "${ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS:-15}"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      miniwdl-docker:
        condition: service_healthy
    volumes:
      - ${ANALYSIS_RAWDATA_HOST_PATH:-./workspace/rawdata}:/analysis/rawdata:ro
      - ${ANALYSIS_DATABASE_HOST_PATH:-./workspace/databases}:/analysis/databases:ro
      - ${ANALYSIS_RUN_HOST_PATH:-./data/analysis-runs}:/analysis/runs
      - ${ANALYSIS_CACHE_HOST_PATH:-./data/analysis-cache}:/analysis/cache
      - ./data/miniwdl-certs/client:/certs/client:ro
    tmpfs:
      - /tmp
    networks:
      - default
      - miniwdl-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  analysis-worker-host:
    profiles: ["wdl-host-runtime"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "backend/manage.py", "run_analysis_worker"]
    user: "${MINIWDL_UID:-1000}:${MINIWDL_GID:-1000}"
    group_add:
      - "${MINIWDL_DOCKER_GID:?Run stat -c '%g' /var/run/docker.sock and set MINIWDL_DOCKER_GID}"
    read_only: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bioworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-bioworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DOCKER_HOST: unix:///var/run/docker.sock
      MINIWDL_RUN_ROOT: ${ANALYSIS_WORKSPACE_HOST_PATH:-/mnt/nas/workspace}
      MINIWDL__CALL_CACHE__DIR: ${ANALYSIS_CACHE_HOST_PATH:-/mnt/nas/workspace/analysis-cache}/calls
      ANALYSIS_RAWDATA_ROOT: ${ANALYSIS_RAWDATA_HOST_PATH:-/mnt/nas/workspace/rawdata}
      ANALYSIS_DATABASE_ROOT: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}
      ANALYSIS_DATABASE_CATALOG: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}/catalog.json
      ANALYSIS_RUN_ROOT: ${ANALYSIS_RUN_HOST_PATH:-/mnt/nas/workspace/analysis-runs}
      ANALYSIS_RESOURCE_MANIFEST_MAX_ENTRIES: "${ANALYSIS_RESOURCE_MANIFEST_MAX_ENTRIES:-100000}"
      ANALYSIS_RESOURCE_MANIFEST_MAX_DEPTH: "${ANALYSIS_RESOURCE_MANIFEST_MAX_DEPTH:-128}"
      ANALYSIS_WORKER_RESOURCE_MANIFEST_TIMEOUT_SECONDS: "${ANALYSIS_WORKER_RESOURCE_MANIFEST_TIMEOUT_SECONDS:-300}"
      ANALYSIS_MANAGED_RESOURCE_MAX_ITEMS: "${ANALYSIS_MANAGED_RESOURCE_MAX_ITEMS:-256}"
      ANALYSIS_MANAGED_FILE_CHECKSUM_MAX_BYTES: "${ANALYSIS_MANAGED_FILE_CHECKSUM_MAX_BYTES:-17179869184}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_ITEMS: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_ITEMS:-256}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_BYTES: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_BYTES:-1099511627776}"
      ANALYSIS_OUTPUT_SNAPSHOT_MAX_DIRECTORY_ENTRIES: "${ANALYSIS_OUTPUT_SNAPSHOT_MAX_DIRECTORY_ENTRIES:-200000}"
      ANALYSIS_OUTPUT_SNAPSHOT_TIMEOUT_SECONDS: "${ANALYSIS_OUTPUT_SNAPSHOT_TIMEOUT_SECONDS:-300}"
      ANALYSIS_OUTPUT_SNAPSHOT_MIN_FREE_BYTES: "${ANALYSIS_OUTPUT_SNAPSHOT_MIN_FREE_BYTES:-1073741824}"
      ANALYSIS_OUTPUT_MANIFEST_MAX_DEPTH: "${ANALYSIS_OUTPUT_MANIFEST_MAX_DEPTH:-32}"
      ANALYSIS_OUTPUT_VALUE_MAX_BYTES: "${ANALYSIS_OUTPUT_VALUE_MAX_BYTES:-65536}"
      ANALYSIS_RESULT_JSON_MAX_BYTES: "${ANALYSIS_RESULT_JSON_MAX_BYTES:-67108864}"
      ANALYSIS_WORKER_POLL_SECONDS: "${ANALYSIS_WORKER_POLL_SECONDS:-2}"
      ANALYSIS_MIN_AVAILABLE_MEMORY_GB: "${ANALYSIS_MIN_AVAILABLE_MEMORY_GB:-40}"
      ANALYSIS_INFRASTRUCTURE_RETRIES: "${ANALYSIS_INFRASTRUCTURE_RETRIES:-0}"
      ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS: "${ANALYSIS_INFRASTRUCTURE_RETRY_DELAY_SECONDS:-15}"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${ANALYSIS_RAWDATA_HOST_PATH:-/mnt/nas/workspace/rawdata}
        target: ${ANALYSIS_RAWDATA_HOST_PATH:-/mnt/nas/workspace/rawdata}
        read_only: true
      - type: bind
        source: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}
        target: ${ANALYSIS_DATABASE_HOST_PATH:-/mnt/nas/workspace/databases}
        read_only: true
      - type: bind
        source: ${ANALYSIS_RUN_HOST_PATH:-/mnt/nas/workspace/analysis-runs}
        target: ${ANALYSIS_RUN_HOST_PATH:-/mnt/nas/workspace/analysis-runs}
      - type: bind
        source: ${ANALYSIS_CACHE_HOST_PATH:-/mnt/nas/workspace/analysis-cache}
        target: ${ANALYSIS_CACHE_HOST_PATH:-/mnt/nas/workspace/analysis-cache}
    tmpfs:
      - /tmp
    networks:
      - default
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  miniwdl-control:
    internal: true
    ipam:
      config:
        - subnet: ${MINIWDL_CONTROL_SUBNET:-10.253.0.0/24}
  miniwdl-egress:
    ipam:
      config:
        - subnet: ${MINIWDL_EGRESS_SUBNET:-10.253.1.0/24}
