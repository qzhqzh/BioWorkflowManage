services:
  reference-connector:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BIOWORKFLOW_TOKEN: "${BIOWORKFLOW_TOKEN:?set BIOWORKFLOW_TOKEN}"
      BIOWORKFLOW_WEBHOOK_SECRET: "${BIOWORKFLOW_WEBHOOK_SECRET:?set BIOWORKFLOW_WEBHOOK_SECRET}"
      REFERENCE_CONNECTOR_INBOUND_TOKEN: "${REFERENCE_CONNECTOR_INBOUND_TOKEN:?set REFERENCE_CONNECTOR_INBOUND_TOKEN}"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./config.compose.json:/etc/reference-connector/config.json:ro
      - connector-state:/var/lib/reference-connector
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  connector-state:
